
[package]
name = "rustlens"
version = "0.7.0"
edition = "2024"
authors = ["Denis Salmanovich"]
readme = "README.md"
description = "Free and open-source user interface designed for managing Kubernetes clusters"
repository = "https://github.com/denix666/rustlens"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
kube = { version = "5.1", default-features = false, features = ["runtime", "derive", "client", "config", "ws", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.29", features = ["latest"] }
futures = "0.3"
eframe = "0.37"
futures-util = "0.3"
image = "0.25"
serde_json = "1.0"
anyhow = "1.0"
home = "0.5"
yaml_serde = "0.10"
serde = "1.0"
regex = "1"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
http = "1.5"
rfd = "0.18"
indexmap = "2"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
toml = "1"
walkdir = "2"
ipnetwork = "0.21"
uuid = { version = "1", features = ["v4", "fast-rng"] }
hmac = "0.13"
sha2 = "0.11"
log = "0.4"
flexi_logger = "0.31"
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "sso"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = [ "rustls", "rt-tokio" ] }
aws-smithy-runtime-api = "1"
aws-smithy-types = { version = "1.9", features = ["serde-serialize", "serde-deserialize"] }
flate2 = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
